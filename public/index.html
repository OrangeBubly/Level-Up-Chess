<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Level Up Chess</title>
<style>
:root{--bg:#09090c;--p:#121217;--p2:#1a1a22;--bd:#2a2a34;--tx:#f3f3f6;--mu:#8e8e9e;--red:#ff2d3d;--c0:#8e8e9e;--c1:#3da9ff;--c2:#b44dff;--c3:#ffb020}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(900px 500px at 90% -10%,rgba(255,45,61,.14),transparent),var(--bg);color:var(--tx);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh;max-width:1400px;margin:0 auto}
aside{padding:24px 16px;border-right:1px solid var(--bd);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
.logo{font-size:20px;font-weight:800;letter-spacing:.5px;margin:0 8px 18px;text-shadow:0 0 18px rgba(255,45,61,.7)}.logo b{color:var(--red)}
.nav{background:none;border:1px solid transparent;color:var(--mu);text-align:left;padding:11px 14px;border-radius:12px;font:inherit;font-weight:600;cursor:pointer;transition:.2s;box-shadow:none}
.nav:hover{color:var(--tx);background:var(--p);filter:none}
.nav.on{color:#fff;background:linear-gradient(90deg,rgba(255,45,61,.22),transparent);border-color:rgba(255,45,61,.5);box-shadow:0 0 18px rgba(255,45,61,.22)}
.me{margin-top:auto;padding:12px;border:1px solid var(--bd);border-radius:12px;background:var(--p);font-size:13px}
main{padding:28px 32px 48px;min-width:0}
h1{margin:0;font-size:28px}h2{margin:0 0 12px;font-size:14px;letter-spacing:1.5px;text-transform:uppercase;color:var(--mu)}
.mu{color:var(--mu);font-size:13px}
.card{background:var(--p);border:1px solid var(--bd);border-radius:16px;padding:20px}
.g2{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.stat{background:var(--p);border:1px solid var(--bd);border-radius:14px;padding:14px;text-align:center}.stat b{display:block;font-size:24px}
.hero{display:flex;gap:22px;align-items:center}
.ring{--p:0;flex:none;width:112px;height:112px;border-radius:50%;background:conic-gradient(var(--red) calc(var(--p)*1%),#26262f 0);display:grid;place-items:center;position:relative;filter:drop-shadow(0 0 12px rgba(255,45,61,.55))}
.ring::before{content:"";position:absolute;inset:9px;background:var(--p);border-radius:50%}
.ring div{position:relative;text-align:center;line-height:1.1}.ring b{font-size:32px;display:block}.ring span{font-size:10px;letter-spacing:2px;color:var(--mu)}
button{font:inherit;font-weight:700;cursor:pointer;border:0;border-radius:10px;padding:10px 16px;background:var(--red);color:#fff;box-shadow:0 0 16px rgba(255,45,61,.45);transition:.2s}
button:hover{filter:brightness(1.15)}button:disabled{opacity:.35;box-shadow:none;cursor:default}
button.g{background:transparent;border:1px solid var(--bd);box-shadow:none;color:var(--tx)}button.g:hover{border-color:var(--red)}
input{width:100%;padding:11px 12px;margin:5px 0;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
input:focus{outline:0;border-color:var(--red);box-shadow:0 0 12px rgba(255,45,61,.3)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.row>*{flex:1}
.err{color:#ff6b78;font-size:13px;min-height:18px;margin-top:6px}
.chip{display:inline-block;padding:3px 9px;margin:3px 4px 0 0;border-radius:99px;font-size:12px;font-weight:700;background:rgba(255,45,61,.13);border:1px solid rgba(255,45,61,.4);color:#ff8a94}
.it{--rc:var(--c0);position:relative;background:linear-gradient(180deg,color-mix(in srgb,var(--rc) 14%,var(--p)),var(--p) 70%);border:1px solid color-mix(in srgb,var(--rc) 55%,#000);border-radius:16px;padding:16px;text-align:center;transition:.25s;display:flex;flex-direction:column;gap:6px}
.it:hover{transform:translateY(-4px);box-shadow:0 8px 30px color-mix(in srgb,var(--rc) 35%,transparent)}
.glyph{font-size:62px;line-height:1.1;color:var(--rc);text-shadow:0 0 24px var(--rc),0 0 6px var(--rc);font-family:"Segoe UI Symbol","Noto Sans Symbols 2","Apple Symbols",serif}
.rar{font-size:11px;font-weight:800;letter-spacing:1.5px;color:var(--rc)}
.fl{font-size:12px;color:var(--mu);font-style:italic;min-height:36px}
.it .row{margin-top:auto}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px;margin-bottom:22px}
.slot{min-height:230px}.slot.empty{border:1px dashed var(--bd);background:var(--p);justify-content:center;color:var(--mu)}
.sn{font-size:11px;letter-spacing:2px;color:var(--mu);font-weight:700}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tabs button{background:var(--p);border:1px solid var(--bd);box-shadow:none;color:var(--mu);padding:7px 14px}.tabs button.on{color:#fff;border-color:var(--red);box-shadow:0 0 14px rgba(255,45,61,.35)}
.bar{height:10px;background:#26262f;border-radius:9px;overflow:hidden;margin:10px 0 4px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#b3001b,var(--red));box-shadow:0 0 12px var(--red)}
.lb{display:flex;align-items:center;gap:14px;padding:12px 8px;border-top:1px solid var(--bd)}.lb:first-child{border-top:0}
.lb .n{width:34px;font-size:20px;text-align:center}.lb .gl{font-size:28px;color:var(--red);text-shadow:0 0 14px var(--red)}.lb .x{margin-left:auto;font-weight:800;color:var(--red);text-shadow:0 0 10px rgba(255,45,61,.6)}
.top1{background:linear-gradient(90deg,rgba(255,45,61,.12),transparent);border-radius:12px}
.bn{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.bn div{background:var(--p2);border-radius:12px;padding:12px;text-align:center}.bn b{display:block;font-size:22px;color:var(--red);text-shadow:0 0 12px rgba(255,45,61,.6)}
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,30px);background:#1f1f28;border:1px solid var(--red);box-shadow:0 0 24px rgba(255,45,61,.5);padding:12px 20px;border-radius:12px;opacity:0;transition:.3s;pointer-events:none;font-weight:700;z-index:9}#toast.on{opacity:1;transform:translate(-50%,0)}
.pop{position:fixed;font-size:30px;pointer-events:none;animation:up 1.3s ease-out forwards;z-index:9}@keyframes up{to{transform:translate(var(--dx),-240px) rotate(240deg);opacity:0}}
.auth{max-width:420px;margin:12vh auto;padding:0 16px}
@media(max-width:860px){.app{grid-template-columns:1fr}aside{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;flex-direction:row;z-index:5;background:var(--bg);border-top:1px solid var(--bd);border-right:0;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}.logo,.me{display:none}.nav{flex:1;text-align:center;padding:9px 4px;font-size:12px}main{padding:18px 14px 96px}.g2{grid-template-columns:1fr}.stats,.bn{grid-template-columns:repeat(2,1fr)}.hero{flex-direction:column;text-align:center}}
</style></head><body><div id="root"></div><div id="toast"></div>
<script>
var S=null,LB=[],tab="home",flt="all",RN=["COMMON","RARE","EPIC","LEGENDARY"],ST={xp:"XP",coin:"Coins",upset:"Underdog",streak:"Streak"};
var SL=[["throne","Throne"],["flank","Flank"],["bastion","Bastion"],["vanguard","Vanguard"],["aura","Aura"],["title","Banner"]];
function esc(s){var d=document.createElement("div");d.textContent=s==null?"":s;return d.innerHTML}
async function api(p,b){var o=b===undefined?{}:{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)};var r=await fetch("/api/"+p,o),j={};try{j=await r.json()}catch(e){}if(!r.ok)throw new Error(j.error||"Request failed");return j}
function toast(m){var t=document.getElementById("toast");t.textContent=m;t.className="on";clearTimeout(toast.h);toast.h=setTimeout(function(){t.className=""},3000)}
function burst(){var a=S&&S.equipped.aura,e=a==="a2"?["🌑","🩸","✨","♛"]:["🔥","✨","♟️","⭐"];for(var i=0;i<20;i++){var p=document.createElement("span");p.className="pop";p.textContent=e[i%e.length];p.style.left=(15+Math.random()*70)+"vw";p.style.top="65vh";p.style.setProperty("--dx",(Math.random()*180-90)+"px");document.body.appendChild(p);setTimeout(function(x){x.remove()}.bind(null,p),1400)}}
function item(id){return S.shop.filter(function(s){return s.id===id})[0]}
function chips(s){var o="";for(var k in s)o+='<span class="chip">+'+s[k]+"% "+ST[k]+"</span>";return o||'<span class="mu">Cosmetic</span>'}
async function boot(){try{S=await api("me")}catch(e){S=null}try{LB=await api("leaderboard")}catch(e){LB=[]}render()}
async function refresh(){try{LB=await api("leaderboard")}catch(e){}}
function card(it,vault){var own=S.owned.indexOf(it.id)>-1,eq=S.equipped[it.slot]===it.id,b;
 if(it.t==="cons")b='<button data-a="buy" data-i="'+it.id+'"'+(S.coins<it.c?" disabled":"")+'>🪙 '+it.c+" · own "+S.shield+"</button>";
 else if(own)b='<button class="'+(eq?"":"g")+'" data-a="equip" data-i="'+it.id+'">'+(eq?(vault===true?"Unequip":"Equipped ✔"):"Equip")+"</button>";
 else b='<button data-a="buy" data-i="'+it.id+'"'+(S.coins<it.c?" disabled":"")+'>🪙 '+it.c+"</button>";
 return'<div class="it" style="--rc:var(--c'+it.r+')"><span class="rar">'+RN[it.r]+" · "+it.slot.toUpperCase()+'</span><div class="glyph">'+it.g+"</div><b>"+it.n+"</b><div>"+chips(it.s)+'</div><div class="fl">'+it.f+'</div><div class="row">'+b+"</div></div>"}
function ccHTML(){
 if(!S.changing&&S.pending)return'<h2>Verify chess.com</h2><p class="mu">Claiming <b>'+esc(S.pending)+'</b>. Paste this code into the <b>Location</b> field of your chess.com profile, save, then press Verify:</p><input readonly value="'+esc(S.code)+'" onclick="this.select()"><div class="row"><button id="vf">Verify</button><button class="g" id="cx">Different username</button></div>';
 if(!S.changing&&S.cc)return'<h2>Chess.com</h2><p>Linked to <b>'+esc(S.cc)+'</b> ✔</p><div class="row"><button id="sy">Sync games</button><button class="g" id="cx">Change</button></div><p class="mu">Rated games only. Win +20 XP, draw +8, loss +3. Upsets and streaks add bonus XP.</p>';
 return'<h2>Link chess.com</h2><input id="cc" placeholder="Your chess.com username"><div class="row"><button id="lk">Continue</button></div>'}
function vHome(){var pct=Math.round((S.xp-S.lo)/(S.hi-S.lo)*100),b=S.bonus,bc="";for(var k in b)bc+='<div><b>+'+b[k]+'%</b><span class="mu">'+ST[k]+"</span></div>";
 return'<div class="g2"><div class="card hero"><div class="ring" style="--p:'+pct+'"><div><b>'+S.level+'</b><span>LEVEL</span></div></div><div style="flex:1"><h1>'+esc(S.username)+'</h1><div class="mu">'+(S.title?esc(S.title):"No banner equipped")+'</div><div class="bar"><i style="width:'+pct+'%"></i></div><div class="mu">'+S.xp+" / "+S.hi+' XP to next level</div></div></div><div class="card">'+ccHTML()+'<div class="err" id="se"></div></div></div>'
 +'<div class="stats"><div class="stat"><b>🪙 '+S.coins+'</b><span class="mu">Coins</span></div><div class="stat"><b>🔥 '+S.streak+'</b><span class="mu">Win streak</span></div><div class="stat"><b>'+S.wins+" / "+S.games+'</b><span class="mu">Wins / games</span></div><div class="stat"><b>⚡ '+S.best+'</b><span class="mu">Best streak</span></div></div>'
 +'<div class="card"><h2>Active bonuses from your loadout</h2><div class="bn">'+bc+"</div></div>"}
function vShop(){var f=[["all","All"]].concat(SL,[["consumable","Consumables"]]);
 var t='<div class="tabs">'+f.map(function(x){return'<button class="'+(flt===x[0]?"on":"")+'" data-f="'+x[0]+'">'+x[1]+"</button>"}).join("")+"</div>";
 var l=S.shop.filter(function(s){return flt==="all"||s.slot===flt}).sort(function(a,b){return a.r-b.r||a.c-b.c});
 return'<h1>Shop</h1><p class="mu" style="margin:4px 0 16px">Spend coins on artifacts, then equip them in your Vault. You have <b>🪙 '+S.coins+'</b>.</p>'+t+'<div class="grid">'+l.map(function(i){return card(i)}).join("")+"</div>"}
function vVault(){var s=SL.map(function(x){var id=S.equipped[x[0]],it=id&&item(id);
  return it?card(it,true).replace('<span class="rar">','<span class="sn">'+x[1].toUpperCase()+'</span><span class="rar">'):'<div class="it slot empty"><span class="sn">'+x[1].toUpperCase()+'</span><div class="glyph" style="color:#333;text-shadow:none">＋</div><div>Empty slot</div><button class="g" data-t="shop">Browse shop</button></div>'}).join("");
 var own=S.shop.filter(function(i){return S.owned.indexOf(i.id)>-1&&S.equipped[i.slot]!==i.id});
 return'<h1>Vault</h1><p class="mu" style="margin:4px 0 16px">Your trophy room. One artifact per slot, and each one boosts how much you earn.</p><div class="slots">'+s+'</div><h2>Collection</h2>'+(own.length?'<div class="grid">'+own.map(function(i){return card(i)}).join("")+"</div>":'<p class="mu">Nothing waiting in storage. Buy artifacts in the shop!</p>')}
function vRanks(){var m=["🥇","🥈","🥉"];return'<h1>Leaderboard</h1><p class="mu" style="margin:4px 0 16px">Top verified players by total XP.</p><div class="card">'+(LB.length?LB.map(function(x,i){return'<div class="lb'+(i===0?" top1":"")+'"><span class="n">'+(m[i]||i+1)+'</span><span class="gl">'+x.g+"</span><div><b>"+esc(x.username)+(S&&S.username===x.username?" (you)":"")+'</b><div class="mu">'+(x.title?esc(x.title)+" · ":"")+"Level "+x.level+" · "+x.wins+" wins · best streak "+x.best+'</div></div><span class="x">'+x.xp+" XP</span></div>"}).join(""):'<p class="mu">No verified players yet. Be the first!</p>')+"</div>"}
function render(){var R=document.getElementById("root");
 if(!S){R.innerHTML='<div class="auth"><div class="logo" style="margin:0 0 6px;font-size:30px">LEVEL UP <b>CHESS</b></div><p class="mu">Turn every chess.com game into XP, loot and glory.</p><div class="card"><input id="un" placeholder="Username" autocomplete="username"><input id="pw" type="password" placeholder="Password (8+ characters)" autocomplete="current-password"><div class="err" id="er"></div><div class="row"><button id="li">Log in</button><button class="g" id="su">Sign up</button></div></div></div>';
  var go=function(p){return async function(){try{await api(p,{username:document.getElementById("un").value,password:document.getElementById("pw").value});tab="home";await boot()}catch(e){document.getElementById("er").textContent=e.message}}};
  document.getElementById("li").onclick=go("login");document.getElementById("su").onclick=go("signup");return}
 var N=[["home","⌂ Home"],["shop","◆ Shop"],["vault","♛ Vault"],["ranks","☰ Ranks"]],V={home:vHome,shop:vShop,vault:vVault,ranks:vRanks};
 R.innerHTML='<div class="app"><aside><div class="logo">LEVEL UP <b>CHESS</b></div>'+N.map(function(n){return'<button class="nav'+(tab===n[0]?" on":"")+'" data-t="'+n[0]+'">'+n[1]+"</button>"}).join("")+'<div class="me"><b>'+esc(S.username)+'</b><div class="mu">Level '+S.level+" · 🪙 "+S.coins+'</div><button class="g" id="lo" style="margin-top:8px;width:100%;padding:6px">Log out</button></div></aside><main>'+V[tab]()+"</main></div>";
 var $=function(i){return document.getElementById(i)};
 $("lo").onclick=async function(){await api("logout",{});S=null;render()};
 if($("lk"))$("lk").onclick=act(function(){return api("cc",{cc:$("cc").value})});
 if($("vf"))$("vf").onclick=act(function(){return api("cc/verify",{})},"Linked! Hit Sync to set your baseline.");
 if($("cx"))$("cx").onclick=function(){S.changing=true;render()};
 if($("sy"))$("sy").onclick=sync}
function act(f,ok){return async function(){var se=document.getElementById("se");if(se)se.textContent="";try{S=await f();await refresh();render();if(ok)toast(ok)}catch(e){var s=document.getElementById("se");if(s)s.textContent=e.message}}}
async function sync(){var se=document.getElementById("se");se.textContent="Syncing…";
 try{var r=await api("sync",{}),fx=!!S.equipped.aura;S=r;await refresh();render();
  if(r.msg)toast(r.msg);else if(r.count){toast(r.count+" new games: +"+r.gained+" XP!"+(r.leveled?" 🎉 Level up!":""));if(r.won&&fx)burst()}else toast("No new rated games since last sync.")
 }catch(e){se.textContent=e.message}}
document.addEventListener("click",async function(e){var b=e.target.closest("[data-a],[data-t],[data-f]");if(!b||!S)return;
 if(b.dataset.t){tab=b.dataset.t;render();window.scrollTo(0,0);return}
 if(b.dataset.f){flt=b.dataset.f;render();return}
 try{var it=item(b.dataset.i),was=it&&S.equipped[it.slot];S=await api(b.dataset.a,{id:b.dataset.i});await refresh();render();toast(b.dataset.a==="buy"?"Purchased! Equip it in your Vault.":was===b.dataset.i?"Unequipped":"Equipped!")}catch(er){toast(er.message)}});
boot();
</script></body></html>
