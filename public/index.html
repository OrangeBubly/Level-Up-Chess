<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Level Up Chess</title>
<style>

[data-theme=royal]{--red:#a855f7;--red2:#6b21a8;--red3:#d8b4fe;--acr:168 85 247;--p:#16121c;--p2:#1e1828;--bd:#2e2640;--mc:#18131f}
[data-theme=ocean]{--red:#38bdf8;--red2:#0369a1;--red3:#bae6fd;--acr:56 189 248;--bg:#070b12;--p:#0f1520;--p2:#16202e;--bd:#22304a;--mc:#101826;--on:#06121c}
[data-theme=inferno]{--red:#ff7a1a;--red2:#b3380a;--red3:#ffc08a;--acr:255 122 26}
[data-theme=gold]{--red:#ffc400;--red2:#a37a00;--red3:#ffe58a;--acr:255 196 0;--on:#1a1300;--bg:#0c0a05;--p:#17140b;--p2:#211c10;--bd:#3a3220;--mc:#191509}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(900px 500px at 90% -10%,rgb(var(--acr) / .14),transparent),var(--bg);color:var(--tx);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh;max-width:1400px;margin:0 auto}

.me{margin-top:auto;padding:12px;border:1px solid var(--bd);border-radius:12px;background:var(--p);font-size:13px}
main{padding:26px 30px 48px;min-width:0}

.mu{color:var(--mu);font-size:13px}.bad{color:var(--red3)}

.g2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-bottom:16px}
.wrap{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start}.wrap>*{flex:1 1 320px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}

.hero{display:flex;gap:20px;align-items:center}

.sl.sil .px{filter:brightness(0) opacity(.55)}.sl.big{width:72px;height:72px}.sl.big .px{width:48px;height:48px}
.bag{display:grid;grid-template-columns:repeat(6,56px);gap:4px;justify-content:start}
.eqs{display:grid;grid-template-columns:repeat(2,56px);gap:4px 10px}.eqs div{display:flex;flex-direction:column;align-items:center;font-size:10px;color:var(--mu);letter-spacing:1px}
.cg{display:grid;grid-template-columns:repeat(3,70px);gap:4px}.cg .sl{width:70px;height:70px}.cg .px{width:46px;height:46px}
.craftrow{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.arrow{font-size:30px;color:var(--red);text-shadow:0 0 12px var(--red)}
.resbox{display:flex;flex-direction:column;gap:5px;align-items:flex-start;min-width:150px}
.rb{display:flex;gap:10px;align-items:center;padding:7px;border:1px solid var(--bd);border-radius:10px;cursor:pointer;margin-bottom:6px}.rb:hover,.rb.on{border-color:var(--red)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}

.bar{height:10px;background:var(--tr);border-radius:9px;overflow:hidden;margin:8px 0 4px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--red2),var(--red));box-shadow:0 0 12px var(--red)}
.it{--rc:var(--c0);background:linear-gradient(180deg,color-mix(in srgb,var(--rc) 14%,var(--p)),var(--p) 70%);border:1px solid color-mix(in srgb,var(--rc) 55%,#000);border-radius:14px;padding:14px;text-align:center;display:flex;flex-direction:column;gap:5px;align-items:center}
.it .px{width:56px;height:56px}.rar2{font-size:11px;font-weight:800;letter-spacing:1.5px;color:var(--rc)}.fl{font-size:12px;color:var(--mu);font-style:italic}
.it .row{width:100%;margin-top:auto}
.ach{display:flex;gap:12px;padding:12px;border:1px solid var(--bd);border-radius:12px;background:var(--p)}.ach.done{border-color:rgb(var(--acr) / .6);box-shadow:0 0 14px rgb(var(--acr) / .18)}.ach .ic{font-size:26px;flex:none;width:34px;text-align:center}
.lb{display:flex;align-items:center;gap:14px;padding:11px 8px;border-top:1px solid var(--bd)}.lb:first-child{border-top:0}
.lb .n{width:34px;font-size:20px;text-align:center}.lb .x{margin-left:auto;font-weight:800;color:var(--red);text-shadow:0 0 10px rgb(var(--acr) / .6)}.lb .px{width:32px;height:32px}
.top1{background:linear-gradient(90deg,rgb(var(--acr) / .12),transparent);border-radius:12px}
.bn{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.bn div{background:var(--p2);border-radius:12px;padding:10px;text-align:center}.bn b{display:block;font-size:21px;color:var(--red);text-shadow:0 0 12px rgb(var(--acr) / .6)}
#tip{position:fixed;z-index:30;pointer-events:none;background:rgba(14,6,14,.96);border:2px solid var(--red2);box-shadow:0 0 14px rgb(var(--acr) / .35);padding:7px 11px;font:13px/1.45 monospace;display:none;max-width:260px}
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,30px);background:var(--p2);border:1px solid var(--red);box-shadow:0 0 24px rgb(var(--acr) / .5);padding:11px 20px;border-radius:12px;opacity:0;transition:.3s;pointer-events:none;font-weight:700;z-index:40;max-width:90%;text-align:center}#toast.on{opacity:1;transform:translate(-50%,0)}
.pop{position:fixed;font-size:30px;pointer-events:none;animation:up 1.3s ease-out forwards;z-index:40}@keyframes up{to{transform:translate(var(--dx),-240px) rotate(240deg);opacity:0}}
.tag{display:inline-block;padding:0 6px;border-radius:6px;font-size:11px;font-weight:800;letter-spacing:1px;background:rgb(var(--acr) / .16);border:1px solid rgb(var(--acr) / .45);color:var(--red3);vertical-align:2px}
a.pl{color:inherit;text-decoration:none;border-bottom:1px dotted var(--mu)}a.pl:hover{color:var(--red);border-color:var(--red)}
select{width:100%;padding:10px 12px;margin:5px 0;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
.rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:560px;margin:8px 0}.rgrid select{margin:0}
.pxed{display:grid;grid-template-columns:repeat(16,1fr);width:min(100%,384px);aspect-ratio:1;margin:10px 0;border:1px solid var(--bd);touch-action:none;user-select:none;cursor:crosshair;
 background:repeating-conic-gradient(rgba(128,128,128,.28) 0 25%,transparent 0 50%) 0 0/24px 24px}.pxed i{display:block;box-shadow:inset 0 0 0 .5px rgba(128,128,128,.25)}
.ic{width:19px;height:19px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-4px}
.nav{display:flex;align-items:center;gap:11px}.nav .ns{display:none}.nav.on .ic{color:var(--red);filter:drop-shadow(0 0 6px rgb(var(--acr) / .6))}
.sl .lk{position:absolute;right:2px;top:1px;color:#ffe29a;line-height:0}.sl .lk .ic{width:12px;height:12px;stroke-width:2.4;filter:drop-shadow(1px 1px 0 #000)}
button .ic{width:15px;height:15px;vertical-align:-2px}
.sw{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;font-weight:700;color:var(--tx)}.sw input{display:none}
.sw i{width:38px;height:22px;border-radius:99px;background:var(--tr);border:1px solid var(--bd);position:relative;transition:.2s;flex:none}
.sw i::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--mu);transition:.2s}
.sw input:checked+i{background:var(--red)}.sw input:checked+i::after{left:18px;background:#fff}
.res{flex:none;width:26px;height:26px;border-radius:7px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px}
.bwrap{display:flex;gap:8px;max-width:460px}.board{position:relative;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr));flex:1;min-width:0;aspect-ratio:1;border-radius:6px;overflow:hidden;box-shadow:0 6px 24px rgba(0,0,0,.35)}
.bq{position:relative;min-width:0;min-height:0}.bq.lt{background:#e9edf2}.bq.dk{background:#8ea0b6}.bq.hl::after{content:"";position:absolute;inset:0;background:rgba(250,204,21,.42)}
.pz{position:absolute;left:5%;top:5%;width:90%;height:90%;z-index:1;stroke-width:3.2;stroke-linejoin:round;stroke-linecap:round;filter:drop-shadow(0 2px 1.5px rgba(0,0,0,.35))}
.pz.glow{filter:drop-shadow(0 0 3px var(--gc)) drop-shadow(0 0 7px var(--gc)) drop-shadow(0 2px 1.5px rgba(0,0,0,.35));animation:glow 1.6s ease-in-out infinite alternate}
@keyframes glow{from{filter:drop-shadow(0 0 2px var(--gc)) drop-shadow(0 0 4px var(--gc)) drop-shadow(0 2px 1.5px rgba(0,0,0,.35))}to{filter:drop-shadow(0 0 4px var(--gc)) drop-shadow(0 0 10px var(--gc)) drop-shadow(0 2px 1.5px rgba(0,0,0,.35))}}
.pz.w{fill:#fff;stroke:#1e293b}.pz.b{fill:#1e293b;stroke:#020617}.pz .dt{fill:none}.pz.w .dt{stroke:#1e293b}.pz.b .dt{stroke:#e2e8f0}.pz circle.dt{fill:currentColor;stroke:none}.pz.w circle.dt{color:#1e293b}.pz.b circle.dt{color:#e2e8f0}
.arr{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
.ebar{width:22px;flex:none;border-radius:6px;background:#1f2937;position:relative;overflow:hidden;border:1px solid var(--bd)}.ebar i{position:absolute;left:0;right:0;bottom:0;background:#f1f5f9;transition:height .3s}
.ebar span{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%) rotate(-90deg);font-size:10px;font-weight:800;color:#ef4444;text-align:center;white-space:nowrap}
.gwrap{position:relative;max-width:460px}.gdot{position:absolute;width:9px;height:9px;border-radius:50%;transform:translate(-50%,-50%);border:1.5px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.35);cursor:pointer;z-index:2;transition:transform .15s}.gdot:hover{transform:translate(-50%,-50%) scale(1.5)}
.graph{width:100%;max-width:460px;height:90px;border-radius:8px;display:block;cursor:pointer;border:1px solid var(--bd)}
.mvs{max-height:420px;overflow:auto}.mv{display:grid;grid-template-columns:34px 1fr 1fr;gap:4px;padding:2px 0}.mvb{cursor:pointer;padding:2px 6px;border-radius:6px;display:flex;align-items:center;gap:6px}.mvb:hover{background:var(--p2)}.mvb.on{background:rgb(var(--acr) / .22);font-weight:800}
.bdg{position:absolute;top:2%;right:2%;z-index:3;width:44%;height:44%;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:900;font-size:clamp(9px,2.2vw,13px);line-height:1;letter-spacing:-.5px;border:2px solid rgba(255,255,255,.9);box-shadow:0 1px 4px rgba(0,0,0,.45);font-family:system-ui,sans-serif}
.pbar{display:flex;align-items:center;gap:8px;max-width:460px;padding:7px 10px;margin:6px 0;border-radius:10px;background:var(--p2);border:1px solid var(--bd);font-size:14px}.pbar.turn{border-color:var(--red);box-shadow:0 0 10px rgb(var(--acr) / .3)}
.pchip{display:inline-block;width:15px;height:15px;border-radius:4px;flex:none;border:1.5px solid #64748b;vertical-align:-2px;margin-right:6px}.pchip.w{background:#fff}.pchip.b{background:#1e293b}
.mvh{font-size:12px;font-weight:800;color:var(--mu);padding-bottom:6px;border-bottom:1px solid var(--bd);margin-bottom:4px}.mvh span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mbdg{width:17px;height:17px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-weight:900;font-size:10px;line-height:1;letter-spacing:-.5px;flex:none;font-style:normal}
a.btn{display:inline-block;font-weight:700;text-decoration:none;border-radius:10px;padding:9px 15px;background:var(--red);color:var(--on);box-shadow:0 0 16px rgb(var(--acr) / .45)}
.rep{width:100%;border-collapse:collapse;font-size:14px}.rep th{text-align:left;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--mu);padding:4px 6px}.rep td{padding:7px 6px;border-top:1px solid var(--bd)}.rep td:not(:first-child),.rep th:not(:first-child){text-align:right;white-space:nowrap}
.gck{width:22px;height:22px;flex:none;border-radius:50%;border:2px solid var(--bd);display:grid;place-items:center;font-weight:900;font-size:13px;color:#fff}.guide .q.ok .gck{background:#16a34a;border-color:#16a34a}.guide .q.ok b{text-decoration:line-through;opacity:.7}
.rbook{display:grid;grid-template-columns:repeat(auto-fill,56px);gap:4px}.ptabs{margin:8px 0 4px}.ptabs button{font-size:14px;padding:8px 16px}
/* extra animations: only with <html class="fx"> */
html.fx body{transition:background-color .3s}
html.fx main.enter{animation:pgIn .32s ease-out}
html.fx main.enter .card,html.fx main.enter .mc,html.fx main.enter .stat,html.fx main.enter .it{animation:popIn .42s cubic-bezier(.2,1.2,.4,1) backwards}
html.fx main.enter .stat:nth-child(2),html.fx main.enter .it:nth-child(2){animation-delay:.04s}html.fx main.enter .stat:nth-child(3),html.fx main.enter .it:nth-child(3){animation-delay:.08s}html.fx main.enter .stat:nth-child(4),html.fx main.enter .it:nth-child(4){animation-delay:.12s}
html.fx main.enter .bar i{animation:barGrow .9s cubic-bezier(.2,.8,.3,1)}
html.fx button{transition:transform .12s,filter .15s,box-shadow .2s}html.fx button:active:not(:disabled){transform:scale(.94)}
html.fx .it,html.fx .stat,html.fx .card{transition:transform .2s,box-shadow .2s}html.fx .it:hover,html.fx .stat:hover{transform:translateY(-3px);box-shadow:0 8px 22px rgba(0,0,0,.25)}
html.fx .sl{transition:transform .14s,background .14s}html.fx .sl:hover{transform:scale(1.07)}
html.fx #toast.on{animation:toastIn .5s cubic-bezier(.2,1.6,.4,1)}
html.fx .bdg{animation:bdgPop .4s cubic-bezier(.2,1.8,.4,1)}
html.fx .pz.slide{animation:slide .24s ease-out}html.fx .pz.slide.glow{animation:slide .24s ease-out,glow 1.6s ease-in-out .24s infinite alternate}
html.fx .gdot{transition:transform .2s}html.fx .nav{transition:background .2s,color .2s,transform .15s}html.fx .nav:active{transform:scale(.96)}
@keyframes pgIn{from{opacity:0;transform:translateY(10px)}}
@keyframes popIn{from{opacity:0;transform:translateY(12px) scale(.97)}}
@keyframes barGrow{from{width:0}}
@keyframes toastIn{from{transform:translate(-50%,40px) scale(.85);opacity:0}}
@keyframes bdgPop{from{transform:scale(0)}60%{transform:scale(1.25)}}
@keyframes slide{from{transform:translate(var(--fx),var(--fy))}}
.auth{max-width:420px;margin:12vh auto;padding:0 16px}
.mer{margin-bottom:20px}.mer .grid{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}.was{text-decoration:line-through;color:var(--mu);font-weight:400}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.th{display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left;background:var(--p2);color:var(--tx);border:1px solid var(--bd);box-shadow:none;padding:10px;border-radius:12px}
.th.on{border-color:var(--red);box-shadow:0 0 14px rgb(var(--acr) / .35)}.th:disabled{opacity:.6}.th i{display:flex;gap:3px}.th i b{width:18px;height:18px;border-radius:5px;border:1px solid rgba(128,128,128,.4)}
.prof{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.qs{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}.qh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
